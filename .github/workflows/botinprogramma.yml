name: Bot Tornei in programma

on:
  schedule:
    - cron: '0 7,15 * * *' # Esegue automaticamente il bot ogni giorno alle 07:00 e alle 15:00
  workflow_dispatch: # Permette di avviarlo manualmente da GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione delle dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install playwright pdfplumber
          playwright install chromium

      - name: Esecuzione dello script Python
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python bot_iscrizionicorsopdf.py # Sostituisci con il nome esatto del tuo script python se diverso

      - name: Commit Risultati
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          git add .
          git commit -m "Aggiornamento automatico JSON tornei e registri" || echo "Nessuna modifica da committare"
          git push origin main
