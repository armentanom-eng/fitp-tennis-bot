name: Bot In Corso Pdf

on:
  schedule:
    - cron: '0 18 * * *' # Alle 20:15 italiane (o 18:00 UTC)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pdfplumber
          playwright install chromium
          playwright install-deps chromium 
          
      - name: Esegui Bot
        run: python bot_iscrizionicorsopdf.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          
      - name: Commit Risultati
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          touch notifiche_inviate.json
          git add notifiche_inviate.json *.json
          git diff --quiet && git diff --staged --quiet || (git pull --rebase --autostash origin main && git commit -m "Aggiornamento dati PDF e registro notifiche" && git push)
