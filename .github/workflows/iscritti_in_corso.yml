name: Bot Iscritti In Corso

on:
  schedule:
    - cron: '30 6 * * *'
    - cron: '0 15 * * *'
    - cron: '30 17 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          
          # Attende che eventuali aggiornamenti automatici di background rilascino il blocco APT
          echo "Verifica blocchi apt in corso..."
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
            echo "Attendere lo sblocco di apt..."
            sleep 3
          done
          
          playwright install-deps chromium
          playwright install chromium
          
      - name: Esegui Bot
        run: python bot_iscritti_in_corso.py
        
      - name: Commit Risultati
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Aggiunge solo i file corretti generati dallo script
          git add Iscritti_Giovanili_In_Corso.json Iscritti_Open_In_Corso.json
          
          # Sincronizza con il remote ed esegue commit e push solo se ci sono modifiche reali
          git diff --quiet && git diff --staged --quiet || (git pull --rebase --autostash origin main && git commit -m "Aggiornamento iscritti in corso" && git push)
